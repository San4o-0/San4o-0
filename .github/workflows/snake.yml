name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # щодня опівночі (UTC)
  workflow_dispatch:        # кнопка ручного запуску у вкладці Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8b5cf6&color_dots=#ede9fe,#c4b5fd,#a78bfa,#8b5cf6,#6d28d9
            dist/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#310a5d,#5b21b6,#8b5cf6,#c084fc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
